<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base target="_top" />
    <link rel="stylesheet" type="text/css" media="screen" href="style.css" />
    <title>ControleEstoque</title>
  </head>
  <body>
    <div id="tutorial" class="tutMarcador"></div>

    <h1>Cadastre seu produto!</h1>

    <div class="wrap">
      <form action="">
        <label for="Nome">Nome</label>
        <input type="text" placeholder="Nome" />
        <label for="qtnd">Quantidade</label>
        <input type="number" placeholder="Quantidade" />
        <label for="preco">Preço</label>
        <input type="text" placeholder="Preço" />
        <label for="pratel">Prateleira</label>
        <input type="text" placeholder="Prateleira" />
        <label for="descricao">Descrição</label>
        <input type="text" placeholder="Descrição" />
        <label for="categor">Categoria</label>
        <input type="text" placeholder="Categoria" />
      </form>

      
    <div id="botoes">
      <button>Cadastrar <img src="./imgs/plus_cdstr.png" /></button>
      <button>Excluir <img src="./imgs/excluir_img.png" /></button>
      <button>Editar <img src="./imgs/edit_img.png" alt="" /></button>
    </div>

     <div class="logo-card">
        <img src="/imgs/logo_card.png" class="logo-img">
    </div>
    </div>

   

  </body>
</html>
